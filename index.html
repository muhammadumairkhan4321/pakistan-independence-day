<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pakistan Independence Day 🇵🇰</title>

    <!-- Professional Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background particles -->
    <div class="particles"></div>

    <!-- Main experience -->
    <main class="hero">

        <!-- Start screen -->
        <section id="startScreen" class="start-screen">

            <div class="mini-star">★</div>

            <h1>PAKISTAN</h1>

            <p>INDEPENDENCE DAY</p>

            <button id="startButton">
                <span>▶</span>
                START EXPERIENCE
            </button>

            <div class="made-with">
                Muhammad Umair Khan 🇵🇰
            </div>

        </section>


        <!-- Main animation -->
        <section id="animation" class="animation hidden">

            <!-- Real Pakistan Flag -->
            <div class="flag-container">

                <img
                    src="pakistan_flag.jpg"
                    alt="Pakistan Flag"
                    class="flag"
                >

                <div class="flag-glow"></div>

            </div>


            <!-- Main Text -->

            <div id="august" class="text august">
                14 AUGUST
            </div>

            <div id="pakistan" class="text pakistan">
                PAKISTAN
            </div>

            <div id="zindabad" class="text zindabad">
                ZINDABAD
            </div>


            <!-- Final message -->

            <div id="finalMessage" class="final-message">

                <div>HAPPY</div>

                <div>INDEPENDENCE DAY</div>

            </div>


            <!-- Creator Name -->

            <div id="codeText" class="code-text">
                MUHAMMAD UMAIR KHAN 🇵🇰
            </div>

        </section>

    </main>


    <!-- Music -->

    <audio
        id="music"
        src="independence_music.mp3"
        preload="auto">
    </audio>


    <script src="script.js"></script>

</body>
</html>
